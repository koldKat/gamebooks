<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Maskable-purpose variant of icon.svg. The maskable icon spec's "safe
       zone" is a centered circle of 80% of the canvas diameter (radius 12.8
       here) - anything outside it can get cropped when the OS applies its
       own adaptive-icon shape (circle/squircle/rounded-square depending on
       launcher). icon.svg's artwork extends to ~18.7 units from center
       (the four outer node circles, plus their stroke), well past that -
       fine for the plain "any" purpose icon (rendered as-is, no cropping),
       but would risk the OS clipping those four dots if reused here
       unscaled. Same artwork, scaled ~0.65x around the center so its
       farthest point comfortably clears the safe zone instead. -->
  <rect x="0" y="0" width="32" height="32" fill="#111827"/>
  <g transform="translate(16,16) scale(0.65) translate(-16,-16)">
    <!-- edges -->
    <line x1="16" y1="16" x2="6"  y2="7"  stroke="#4b5563" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="26" y2="7"  stroke="#4b5563" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="6"  y2="26" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="16" y1="16" x2="26" y2="26" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round"/>
    <!-- child nodes -->
    <circle cx="6"  cy="7"  r="4" fill="#8e44ad" stroke="#6c3483" stroke-width="1.2"/>
    <circle cx="26" cy="7"  r="4" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
    <circle cx="6"  cy="26" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1.2"/>
    <circle cx="26" cy="26" r="4" fill="#27ae60" stroke="#1e8449" stroke-width="1.2"/>
    <!-- central node -->
    <circle cx="16" cy="16" r="6" fill="#f5a623" stroke="#c47d00" stroke-width="1.5"/>
  </g>
</svg>
