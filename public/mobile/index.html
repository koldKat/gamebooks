<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamebook Tracker</title>
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Own manifest, not public/manifest.json (desktop's own) - both are
     standalone now, but installing from the root URL (what a phone browser
     actually lands on unless the user manually navigates to /mobile first)
     used to show the address bar regardless of anything fixed here, since
     Chrome reads whichever page's own <link rel="manifest"> was active at
     install time - editing this file never touched that one. -->
<link rel="manifest" href="/mobile/manifest.json">
<link rel="stylesheet" href="/css/confirm.css">
<link rel="stylesheet" href="/css/autocomplete.css">
<link rel="stylesheet" href="/css/equipment.css">
<link rel="stylesheet" href="/css/battlesim.css">
<link rel="stylesheet" href="/mobile/css/style.css">
</head>
<body>
<div id="screen"></div>
<!-- Hidden mount point so getPlayBtnRow() (charsheet.js, shared with every
     battlesim*.js overlay) has somewhere to attach its auto-created trigger
     button on this page - real mobile UI is reader.js's own inline button
     row instead, which drives the sim by clicking this hidden button
     programmatically, so it's never meant to be seen. -->
<div id="m-sim-btn-row" style="display:none"></div>
<script src="/vendor/vis-network/vis-network.min.js"></script>
<script type="module" src="/mobile/js/app.js"></script>
</body>
</html>
